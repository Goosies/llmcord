# Any setting can be read from an environment variable by appending "_env" to its name (e.g. bot_token_env: DISCORD_BOT_TOKEN).

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

status_message: "@ me to chat"

max_text: 100000
max_images: 5
max_messages: 10

use_plain_responses: false
allow_dms: true
reply_without_mention: true  # replying to the bot's message counts as talking to it, even with the ping off

permissions:
  users:
    admin_ids: []        # put your Discord user ID here to use /model
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []

random_replies:
  enabled: true
  chance: 0.03            # 3% of messages (0.05 = 5%)
  cooldown_seconds: 600   # minimum gap between random replies
  context_messages: 8     # recent chat the bot reads before chiming in
  channel_ids: []         # empty = every channel the bot can see

learning:                 # the bot picks up the server's slang, jokes and vibe from chat
  enabled: true
  speech_habits: true     # measure how people type (lowercase, length, emoji, phrases) and match it
  style_samples: 8        # random real messages shown to the bot each reply
  lore_every_messages: 200  # rebuild its notes about the server after this many new messages
  lore_source_messages: 120 # how many recent messages those notes are built from
  max_context_chars: 7000 # cap on learned stuff added to each prompt (lowest priority gets dropped)
  background_model:       # optional, e.g. ollama/llama3.1:8b for the background learning jobs
  ignored_user_ids: []    # people whose messages should never be learned from
  channel_ids: []         # empty = learn from every channel the bot can see

persona:                  # an evolving personality that drifts toward how the server talks
  enabled: true
  evolve_every_messages: 300  # rewrite the personality after this many new messages
  seed: |                 # starting personality (used until the first rewrite)
    You are dry, a little sarcastic, and loyal underneath it. You roast people
    for dumb mistakes but never mean-spirited. You talk like a normal person in
    a group chat: casual, short, no speeches.
  guardrails:             # rules that never change, no matter how the personality evolves
    - Never claim to be human if someone sincerely asks whether you're a bot.
    - No slurs or hateful jokes about anyone's race, religion, sexuality or identity, even if people here joke like that.
    - If someone seems genuinely upset, drop the roasting and be decent to them.
    - Don't bring up anything private or sensitive about someone in front of others.

people:                   # notes on each person, plus facts added with /remember
  enabled: true
  notes_every_messages: 50  # update someone's notes after they send this many new messages
  max_in_context: 4       # how many people's notes the bot sees per reply
  roster_size: 15         # how many regulars it knows by name and ID

feedback:                 # learns which of its messages land from reactions and replies
  enabled: true
  show_hits: 4            # how many of its best-received lines it sees as examples

media:                    # the bot remembers gifs/images/videos people post and can send them back
  enabled: true
  offer_chance: 0.4       # how often the bot gets a few to pick from when replying
  candidates: 8           # how many options it sees each time
  reuse_cooldown_hours: 12  # don't resend the same thing within this window
  save_files: true        # keep copies of files uploaded to Discord (their links expire after a day)
  max_file_mb: 8
  max_total_mb: 1000

reactions:                # the bot reacts with the server's favorite emoji
  enabled: true
  chance: 0.05            # chance to react (no reply) to a message nobody aimed at it
  cooldown_seconds: 300   # minimum gap between those reaction-only chime-ins
  offer_chance: 0.35      # how often it may also react to messages it replies to
  options: 8              # how many of the server's favorite emoji it picks from

mood:                     # time of day, how busy chat is, and a mood based on how people treat it
  enabled: true

recall:                   # "remember when..." - brings up old moments related to what's being said
  enabled: true
  embedding_model: ollama/nomic-embed-text  # run: ollama pull nomic-embed-text (leave blank for keyword matching)
  min_similarity: 0.6     # how closely an old moment must match to be brought up
  max_moments: 2
  min_age_hours: 6        # only recall things older than this

wiki:                     # looks up real Barotrauma questions on the official wiki
  enabled: true

auto_switch:              # fast text model normally, vision model only when there's an image
  enabled: false
  text_model: ollama/llama3.1:8b
  vision_model: ollama/gemma4:12b-it-qat

providers:
  ollama:
    base_url: http://localhost:11434/v1

models:
  # First model is the default at startup. Name must match `ollama list`.
  ollama/llama3.2:

system_prompt: |
  You are Captain Vex, a gruff, sharp-tongued space pirate who captains the
  starship Rusty Comet. Stay in character at all times. Keep replies short
  (1-3 sentences) unless asked for more. Use pirate slang lightly, not every
  line. Never claim to be human if someone sincerely asks.

  Today's date is {date}. The current time is {time}.

  User messages are prefixed with their Discord ID as <@ID>. Use this format to mention users.
