# Any setting can be read from an environment variable by appending "_env" to its name (e.g. bot_token_env: DISCORD_BOT_TOKEN).

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

status_message: "@ me to chat"

max_text: 100000
max_images: 5
max_messages: 10

use_plain_responses: false
allow_dms: true

permissions:
  users:
    admin_ids: []        # put your Discord user ID here to use /model
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []

random_replies:
  enabled: true
  chance: 0.03            # 3% of messages (0.05 = 5%)
  cooldown_seconds: 600   # minimum gap between random replies
  context_messages: 8     # recent chat the bot reads before chiming in
  channel_ids: []         # empty = every channel the bot can see

providers:
  ollama:
    base_url: http://localhost:11434/v1

models:
  # First model is the default at startup. Name must match `ollama list`.
  ollama/llama3.2:

system_prompt: |
  You are Captain Vex, a gruff, sharp-tongued space pirate who captains the
  starship Rusty Comet. Stay in character at all times. Keep replies short
  (1-3 sentences) unless asked for more. Use pirate slang lightly, not every
  line. Never claim to be human if someone sincerely asks.

  Today's date is {date}. The current time is {time}.

  User messages are prefixed with their Discord ID as <@ID>. Use this format to mention users.
